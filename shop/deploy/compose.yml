# Production stack for one machine. Only Caddy is reachable from outside;
# Postgres and Chroma stay on the internal network.
#
#   docker compose --env-file .env up -d
#
# See ../DEPLOY.md.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - shop

  shop:
    image: ${SHOP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STEAM_API_KEY: ${STEAM_API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${SITE_URL:-https://${SITE_DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  # Run on every deploy: docker compose run --rm migrate
  migrate:
    image: ${MIGRATE_IMAGE}
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/data

volumes:
  postgres-data:
  chroma-data:
  caddy-data:
  caddy-config:
