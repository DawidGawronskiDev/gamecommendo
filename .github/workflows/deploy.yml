name: Deploy

# Runs after CI passes on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SHOP_IMAGE: ghcr.io/${{ github.repository }}
  MIGRATE_IMAGE: ghcr.io/${{ github.repository }}-migrate

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: version
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "shop=$(echo "$SHOP_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "migrate=$(echo "$MIGRATE_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the shop image
        uses: docker/build-push-action@v6
        with:
          context: shop
          target: shop
          push: true
          tags: |
            ${{ steps.version.outputs.shop }}:${{ steps.version.outputs.sha }}
            ${{ steps.version.outputs.shop }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migrate image
        uses: docker/build-push-action@v6
        with:
          context: shop
          target: migrate
          push: true
          tags: |
            ${{ steps.version.outputs.migrate }}:${{ steps.version.outputs.sha }}
            ${{ steps.version.outputs.migrate }}:latest
          cache-from: type=gha

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy the stack definition
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_PORT || 22 }}" \
            shop/deploy/compose.yml shop/deploy/Caddyfile \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Release
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<EOF
          set -euo pipefail
          cd "${{ secrets.VPS_PATH }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export SHOP_IMAGE="${{ steps.version.outputs.shop }}:${{ steps.version.outputs.sha }}"
          export MIGRATE_IMAGE="${{ steps.version.outputs.migrate }}:${{ steps.version.outputs.sha }}"
          docker compose pull shop migrate
          docker compose up -d postgres chroma
          docker compose run --rm migrate
          docker compose up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io
          EOF

      - name: Check the site answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "https://${{ secrets.SITE_DOMAIN }}/login" > /dev/null; then
              echo "Site is up"; exit 0
            fi
            sleep 10
          done
          echo "Site did not answer after the release" >&2
          exit 1
